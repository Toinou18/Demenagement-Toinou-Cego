<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes pages</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    ul { list-style-type: none; padding: 0; }
    li { margin: 10px 0; }
    a { color: #0366d6; text-decoration: none; font-size: 1.1rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Sommaire des pages</h1>
  <ul id="file-list">Chargement des pages...</ul>

  <script>
    // ⚠️ REMPLACEZ CES DEUX VARIABLES PAR VOS INFORMATIONS
    const USERNAME = 'toinou18';
    const REPO = 'Demenagement-Toinou-Cego';

    async function getPages() {
      const listElement = document.getElementById('file-list');
      try {
        const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
        const files = await response.json();

        // Vider le message de chargement
        listElement.innerHTML = '';

        files.forEach(file => {
          // On ne garde que les fichiers .html et on exclut index.html
          if (file.type === 'file' && file.name.endsWith('.html') && file.name !== 'index.html') {
            const li = document.createElement('li');
            const a = document.createElement('a');
            
            // Lien relatif vers la page
            a.href = file.name;
            // Titre du lien (ex: "ma-page.html" devient "ma-page")
            a.textContent = file.name.replace('.html', ''); 

            li.appendChild(a);
            listElement.appendChild(li);
          }
        });

        if (listElement.children.length === 0) {
          listElement.innerHTML = '<li>Aucune autre page HTML trouvée.</li>';
        }

      } catch (error) {
        console.error('Erreur lors de la récupération des fichiers :', error);
        listElement.innerHTML = '<li>Impossible de charger la liste des pages.</li>';
      }
    }

    getPages();
  </script>
</body>
</html>
